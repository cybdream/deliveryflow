# Railway-managed PostgreSQL variables: PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema creation is kept automatic until database migrations are introduced.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=PT1H

# Keep Swagger available for the portfolio demo; set APP_SWAGGER_ENABLED=false later if desired.
springdoc.api-docs.enabled=${APP_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${APP_SWAGGER_ENABLED:true}
