spring.application.name=deliveryflow

# Loads application-local.properties on this computer only.
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep API sections in a predictable order; Authentication is listed first.
springdoc.swagger-ui.tags-sorter=alpha

# Hosting services such as Railway provide PORT at runtime.
server.port=${PORT:8080}

